services:
  backend:
    build:
      context: ./app/app/SFTG-backend
      dockerfile: Dockerfile
    image: anupkumar9705/sftg-backend:latest
    container_name: sftg_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql_db:3306/SFTG?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost}
      FILE_UPLOAD_DIR: /app/uploads
    ports:
      # Bound to localhost only; the public entry point is Caddy (tls profile).
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - sftg-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/actuator/health/liveness >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./app/app/SFTG-frontend
      dockerfile: Dockerfile
      args:
        # /api = same-origin: nginx proxies /api/ to the backend.
        # Set an absolute URL only when frontend and backend are on different hosts.
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: anupkumar9705/sftg-frontend:latest
    container_name: sftg_frontend
    depends_on:
      - backend
    ports:
      # Host 80 -> unprivileged nginx (container 8080).
      # When the `tls` profile is active, set FRONTEND_PORT=8081 so Caddy can
      # own host ports 80/443.
      - "127.0.0.1:${FRONTEND_PORT:-80}:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    networks:
      - sftg-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: SFTG
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    ports:
      # Bound to localhost only — never expose MySQL to the internet.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    restart: unless-stopped
    networks:
      - sftg-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------
  # Optional public TLS entry point.
  # Start with:  docker compose --profile tls up -d --build --wait
  # Set DOMAIN=files.example.com (DNS A record -> this server) and
  # FRONTEND_PORT=8081 so Caddy can bind host ports 80/443.
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: sftg_caddy
    profiles: ["tls"]
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped
    networks:
      - sftg-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  sftg-network:
    driver: bridge
