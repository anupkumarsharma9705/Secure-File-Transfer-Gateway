version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      spring-framework:
        patterns:
          - "org.springframework:*"
      testing:
        patterns:
          - "org.junit:*"
          - "org.mockito:*"
          - "org.assertj:*"
      observability:
        patterns:
          - "io.micrometer:*"
          - "org.springframework.boot:spring-boot-starter-actuator"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        versions: ["3.0.0", "3.0.1"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "docker"