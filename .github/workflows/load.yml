name: Load Tests

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 02:00 UTC
  workflow_dispatch:
  release:
    types: [published]

jobs:
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Configure test environment
        run: |
          cat > .env.load << 'EOF'
          DB_URL=jdbc:mysql://mysql_db:3306/SFTG?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME=testuser
          DB_PASSWORD=testpass
          JWT_SECRET=dGVzdF9zZWNyZXRfa2V5X3RoYXRfaXNfNjRfYnl0ZXNfbG9uZ19mb3JfaHM1MTI=
          JWT_EXPIRATION_MS=7200000
          MAIL_HOST=smtp-relay.brevo.com
          MAIL_PORT=587
          MAIL_USERNAME=test
          MAIL_PASSWORD=test
          BREVO_API_KEY=test
          CORS_ALLOWED_ORIGIN=http://localhost
          VITE_API_URL=http://localhost:8000/api
          EOF

      - name: Start stack
        run: docker compose --env-file .env.load up --build -d --wait

      - name: Wait for backend
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8000/api/stats/health | grep -q OK; do sleep 2; done'

      - name: Run k6 scenarios
        id: k6
        run: |
          mkdir -p load-tests
          cat > load-tests/baseline-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          export const errorRate = new Rate('errors');
          export const latency = new Trend('latency');

          export const options = {
            scenarios: {
              smoke: {
                executor: 'constant-vus',
                vus: 1,
                duration: '30s',
                tags: { test_type: 'smoke' },
              },
              load: {
                executor: 'ramping-vus',
                startVUs: 0,
                stages: [
                  { duration: '30s', target: 10 },
                  { duration: '1m', target: 10 },
                  { duration: '30s', target: 20 },
                  { duration: '1m', target: 20 },
                  { duration: '30s', target: 0 },
                ],
                tags: { test_type: 'load' },
              },
              stress: {
                executor: 'ramping-vus',
                startVUs: 0,
                stages: [
                  { duration: '30s', target: 10 },
                  { duration: '1m', target: 20 },
                  { duration: '30s', target: 50 },
                  { duration: '1m', target: 50 },
                  { duration: '30s', target: 100 },
                  { duration: '30s', target: 0 },
                ],
                tags: { test_type: 'stress' },
                startTime: '3m',
              },
            },
            thresholds: {
              'http_req_duration{test_type:smoke}': ['p(95)<500'],
              'http_req_duration{test_type:load}': ['p(95)<800'],
              'http_req_duration{test_type:stress}': ['p(95)<2000'],
              'errors': ['rate<0.05'],
            },
          };

          const BASE_URL = __ENV.BASE_URL || 'http://localhost:8000';

          export default function () {
            const start = new Date();
            const res = http.get(`${BASE_URL}/api/stats/health`);
            latency.add(new Date() - start);

            check(res, {
              'health status 200': (r) => r.status === 200,
              'response has OK': (r) => r.body.includes('OK'),
            });
            errorRate.add(res.status !== 200);

            sleep(1);
          }
          EOF

          k6 run --out json=load-tests/results.json --summary-export=load-tests/summary.json load-tests/baseline-test.js

      - name: Generate RESULTS.md
        run: |
          {
            echo "# Load Test Results"
            echo ""
            echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "## Scenarios"
            echo ""
            echo "| Scenario | VUs | Duration | Threshold (p95) |"
            echo "|----------|-----|----------|-----------------|"
            echo "| Smoke | 1 | 30s | < 500 ms |"
            echo "| Load | 0→20 | 3m | < 800 ms |"
            echo "| Stress | 0→100 | 4m | < 2000 ms |"
            echo ""
            echo "All scenarios assert error rate < 5%."
            echo ""
            echo "## Raw data"
            echo "- [results.json](results.json)"
            echo "- [summary.json](summary.json)"
            echo ""
            echo "## Summary extract"
            echo '```json'
            cat load-tests/summary.json
            echo '```'
          } > load-tests/RESULTS.md

      - name: Upload load-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-tests/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.load down -v
