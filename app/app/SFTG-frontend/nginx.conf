# Preserve the original scheme when Caddy terminates TLS in front of nginx.
map $http_x_forwarded_proto $sftg_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Unprivileged nginx image runs as UID 101 and cannot bind port 80.
    # docker-compose maps host port 80 -> container port 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: browser calls /api/... and nginx forwards to Spring Boot.
    # The resolver + variable defer DNS lookup to request time, so nginx still
    # starts when the backend is restarting (and standalone frontend images can
    # be built with an absolute VITE_API_URL instead).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sftg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # React router — send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; frame-ancestors 'self'" always;

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
