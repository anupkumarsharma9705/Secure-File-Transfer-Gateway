spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:7200000}

virustotal.api.key=${VIRUSTOTAL_API_KEY:}
virustotal.base-url=${VIRUSTOTAL_BASE_URL:https://www.virustotal.com/api/v3}
virustotal.upload-unknown=${VIRUSTOTAL_UPLOAD_UNKNOWN:true}
virustotal.poll-attempts=${VIRUSTOTAL_POLL_ATTEMPTS:2}
virustotal.poll-interval-ms=${VIRUSTOTAL_POLL_INTERVAL_MS:20000}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

brevo.api.key=${BREVO_API_KEY}

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
