spring.datasource.url=jdbc:mysql://localhost:3306/SFTG?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:your_local_user}
spring.datasource.password=${DB_PASSWORD:your_local_password}

virustotal.api.key=${VIRUSTOTAL_API_KEY:}
virustotal.base-url=${VIRUSTOTAL_BASE_URL:https://www.virustotal.com/api/v3}
virustotal.upload-unknown=${VIRUSTOTAL_UPLOAD_UNKNOWN:true}
virustotal.poll-attempts=${VIRUSTOTAL_POLL_ATTEMPTS:2}
virustotal.poll-interval-ms=${VIRUSTOTAL_POLL_INTERVAL_MS:20000}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:7200000}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_brevo_smtp_user@example.com}
spring.mail.password=${MAIL_PASSWORD:your_brevo_smtp_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

brevo.api.key=${BREVO_API_KEY}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
